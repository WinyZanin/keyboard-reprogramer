name: Package release

# Builds every artifact of a final version and attaches it to its GitHub release.
# - Called by release-please.yml after release-please creates a release (tags created with
#   GITHUB_TOKEN don't trigger workflows by themselves).
# - Also runs when a final tag vX.Y.Z is pushed by hand (the first release, or a re-run);
#   the release is created if it doesn't exist yet.
on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  push:
    tags: ['v*', '!v*-*'] # final versions only, not vX.Y.Z-beta.N

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-gnu

      - uses: Swatinem/rust-cache@v2

      - name: Check tag matches Cargo.toml version
        shell: pwsh
        run: |
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          if ($env:TAG -ne "v$version") { throw "Tag $env:TAG does not match Cargo.toml version $version" }

      - name: Install Inno Setup and WiX
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          dotnet tool install --global wix --version 5.0.2
          wix extension add --global WixToolset.UI.wixext/5.0.2

      - name: Build and package
        shell: pwsh
        run: ./tools/package.ps1

      - name: Attach artifacts to the release
        shell: pwsh
        run: |
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:TAG --verify-tag --title "Keyboard Reprogramer $($env:TAG.TrimStart('v'))" --generate-notes
            if ($LASTEXITCODE -ne 0) { throw 'gh release create failed' }
          }
          gh release upload $env:TAG (Get-ChildItem dist -File).FullName --clobber
          if ($LASTEXITCODE -ne 0) { throw 'gh release upload failed' }
