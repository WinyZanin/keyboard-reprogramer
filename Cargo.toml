[package]
name = "keyboard-reprogramer"
version = "0.4.0"
edition = "2021"
description = "Remaps rarely used keys to media control actions on Windows"
authors = ["WinyZanin"]
license = "MIT"
repository = "https://github.com/WinyZanin/keyboard-reprogramer"

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "1"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Gdi",
    "Win32_System_ApplicationInstallationAndServicing",
    "Win32_System_Com",
    "Win32_System_SystemInformation",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_System_LibraryLoader",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_Security",
] }

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
panic = "abort"
